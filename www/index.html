<!doctype html>
<html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LiveCard</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;color:#7a0a10;font:16px/1.5 system-ui,sans-serif;text-align:center;padding:20px}
img{width:160px;height:160px;border-radius:36px}h1{display:none}small{opacity:.6}
button{margin-top:16px;padding:12px 22px;border:0;border-radius:10px;background:#f59a1a;color:#06133f;font:inherit;font-weight:600;display:none}
</style></head><body>
<img src="icon.png" alt=""><h1>LiveCard</h1><div id="m">खुल रहा है…</div><small style="color:#888">संस्करण __VER__</small>
<button id="b" onclick="go()">फिर कोशिश करें</button>
<script>
var URL='https://livecard.in/studio/app/?t='+Date.now();
function go(){
  document.getElementById('b').style.display='none';
  document.getElementById('m').textContent='खुल रहा है…';
  var c=new AbortController();var t=setTimeout(function(){c.abort()},8000);
  fetch(URL,{mode:'no-cors',signal:c.signal}).then(function(){clearTimeout(t);location.replace(URL)}).catch(function(){
    document.getElementById('m').textContent='इंटरनेट नहीं मिला। कनेक्शन देखकर फिर कोशिश करें।';
    document.getElementById('b').style.display='inline-block';
  });
}
setTimeout(go,600);
</script></body></html>
